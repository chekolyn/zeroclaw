[project]
name = "zc_engine"
version = "0.1.0"
description = "ZeroClaw unified engine — sidecar + event engine + CLI (package zc_engine)"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3",
    "toml>=0.10",
    "tomli_w>=1.0",
    "jinja2>=3.0",
    "watchdog>=3.0",
    "pyjwt>=2.0",
    "cryptography>=41.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "faststream[mqtt,opentelemetry]>=0.7.4,<0.8",
    "faststream_fastapi>=1.2.1",
    # --- Phase 5: OpenTelemetry tracing + metrics ---
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b",
    "opentelemetry-instrumentation-logging>=0.48b",
    "opentelemetry-exporter-prometheus>=0.49b0",
    # --- SP3: Postgres via SQLModel (async asyncpg + sync psycopg3) ---
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0",  # greenlet — required by AsyncSession
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # --- Verify/eval framework: A2A client (GatewayClientFactory override reuses
    # the a2a-sdk's CompatJsonRpcTransport for the gateway's message/send contract) ---
    "a2a-sdk>=1.1.2,<2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zc_engine"]

[project.scripts]
zc-engine = "zc_engine.cli:main"
event_engine = "zc_engine.engine.__main__:main"

[dependency-groups]
gateway = ["jsonschema", "paho-mqtt>=2.0"]
test = ["testcontainers[postgres]>=4.0"]
